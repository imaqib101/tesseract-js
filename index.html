<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesseract.js OCR Web Engine</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 Tesseract.js OCR Engine</h1>
      <p>High-accuracy text recognition in the browser powered by WebAssembly</p>
    </header>

    <main>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="drop-prompt">
          <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <p>Drag & drop your image here, or <span>browse files</span></p>
        </div>
        <img id="imagePreview" alt="Preview" style="display:none;" />
      </div>

      <div class="status-card" id="statusCard" style="display:none;">
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="status-text" id="statusText">Initializing worker...</p>
      </div>

      <div class="result-card" id="resultCard" style="display:none;">
        <div class="result-header">
          <h3>Extracted Text</h3>
          <button id="copyBtn" class="btn secondary">📋 Copy Text</button>
        </div>
        <textarea id="outputArea" rows="8" readonly></textarea>
      </div>
    </main>

    <footer>
      <p>Crafted by <a href="https://github.com/imaqib101">Mohammed Aqib</a></p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
